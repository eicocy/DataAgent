<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图表配置 — DataLens Agent</title><link rel="stylesheet" href="../../assets/css/tokens.css"><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/components.css"><link rel="stylesheet" href="../../assets/css/pages.css"></head><body data-page-title="图表配置"><div class="app-shell"><aside class="sidebar"><a class="brand" href="../../index.html"><span class="brand-mark">DL</span><span class="brand-copy"><span class="brand-name">DataLens Agent</span></span></a><nav class="nav-list"><a class="nav-item" href="../dashboard/dashboard.html"><span class="nav-icon">◫</span><span class="nav-copy">Dashboard</span></a><a class="nav-item" aria-current="page" href="../analysis/analysis-workspace.html"><span class="nav-icon">✦</span><span class="nav-copy">智能分析</span></a></nav></aside><div class="main-shell"><header class="topbar"><span class="topbar-title">图表配置</span><span class="prototype-flag">仅演示配置，不重新计算</span></header><main class="page"><div class="page-head"><div><a class="caption" href="chart-view.html">← 返回图表</a><h1 style="margin-top:7px">调整展示方式</h1><p>图表只能使用 Tool Result 中已有的维度与指标。</p></div></div><div class="two-column"><form class="card" novalidate data-prototype-submit data-success-message="原型图表配置已应用"><div class="card-body" style="display:grid;gap:16px"><div class="field"><label for="chart-type">图表类型</label><select class="select" id="chart-type"><option>柱状图</option><option>折线图</option><option>饼图</option></select><span class="caption">原型接受系统原生下拉样式；正式 Vue 使用 Element Plus Select。</span></div><div class="field"><label for="x-field">维度（X 轴）</label><select class="select" id="x-field"><option>region（地区）</option></select></div><div class="field"><label for="y-field">指标（Y 轴）</label><select class="select" id="y-field"><option>sales_sum（销售额合计）</option></select></div><div class="field"><label for="unit">单位</label><input class="input" id="unit" value="元"></div><button onclick="return window.prototypeButtonClick ? window.prototypeButtonClick(this, event) : true" class="btn btn-primary" type="submit">应用到图表</button></div></form><aside class="card"><div class="card-body"><h2>安全边界</h2><ul class="muted"><li>不执行模型生成的 JavaScript。</li><li>ChartSpec 只允许 bar、line、pie。</li><li>维度和指标必须出现在 Tool Result。</li><li>所有图表提供数据表替代。</li></ul></div></aside></div></main></div></div><script src="../../assets/js/prototype.js"></script></body></html>
