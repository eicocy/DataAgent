<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 — DataLens Agent</title><link rel="stylesheet" href="../../assets/css/tokens.css"><link rel="stylesheet" href="../../assets/css/base.css"><link rel="stylesheet" href="../../assets/css/components.css"><link rel="stylesheet" href="../../assets/css/pages.css"></head>
<body data-page-title="注册"><main class="auth-page"><section class="auth-story"><a class="brand" href="../../index.html"><span class="brand-mark">DL</span><span class="brand-copy"><span class="brand-name">DataLens Agent</span><br><span class="brand-sub">数据有据，结论可查</span></span></a><div style="position:relative;z-index:1"><span class="prototype-flag">原型演示数据</span><h1 style="font-size:38px;margin-top:18px">建立你的分析空间</h1><p style="color:#b9c7d9">每个用户只访问自己的数据集、会话和分析记录。</p></div><p class="caption" style="color:#90a4bc">账号用于演示数据归属与权限边界</p></section><section class="auth-form-wrap"><form class="auth-form" novalidate data-prototype-submit data-success-message="原型注册成功，请登录"><a href="login.html" class="caption">← 返回登录</a><h1 style="margin-top:24px">创建账号</h1><p class="muted">完成后即可上传第一份数据。</p><div class="field" style="margin-top:20px"><label for="new-user">用户名</label><input class="input" id="new-user" autocomplete="username" placeholder="4–20 个字符"></div><div class="field" style="margin-top:14px"><label for="new-pass">密码</label><div style="display:flex;gap:8px"><input class="input" id="new-pass" type="password" autocomplete="new-password" aria-describedby="pass-help"><button onclick="return window.prototypeButtonClick ? window.prototypeButtonClick(this, event) : true" class="btn btn-secondary" type="button" data-password-toggle="new-pass" aria-label="显示密码">显示</button></div><span id="pass-help" class="caption">至少 8 位；首期不强制复杂组合。</span></div><div class="field" style="margin-top:14px"><label for="confirm-pass">确认密码</label><input class="input" id="confirm-pass" type="password" autocomplete="new-password"></div><label style="display:flex;gap:9px;margin-top:16px"><input type="checkbox"> <span class="muted">我了解本系统仅用于分析自己有权使用的数据。</span></label><button onclick="return window.prototypeButtonClick ? window.prototypeButtonClick(this, event) : true" class="btn btn-primary" type="submit" style="width:100%;margin-top:20px">创建账号</button></form></section></main><script src="../../assets/js/prototype.js"></script></body></html>
